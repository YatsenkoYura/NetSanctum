services:
  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Web Server ─────────────────────────────────
  web:
    build:
      context: .
      args:
        NETSANCTUM_MODULES: ${NETSANCTUM_MODULES:-default}
        NETSANCTUM_EXTERNAL_MODULES: ${NETSANCTUM_EXTERNAL_MODULES:-}
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    restart: unless-stopped
    env_file: .env
    environment:
      NETSANCTUM_PROCESS_ROLE: web
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      - .:/app:ro
      - ./storage:/app/storage
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python -m app.core.migrations upgrade &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ── Celery Worker ──────────────────────────────────────
  worker:
    build:
      context: .
      args:
        NETSANCTUM_MODULES: ${NETSANCTUM_MODULES:-default}
        NETSANCTUM_EXTERNAL_MODULES: ${NETSANCTUM_EXTERNAL_MODULES:-}
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    restart: unless-stopped
    env_file: .env
    environment:
      NETSANCTUM_PROCESS_ROLE: worker
    volumes:
      - .:/app:ro
      - ./storage:/app/storage
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python -m app.core.migrations upgrade &&
             exec celery -A app.core.scheduler:celery_app worker
             --loglevel=info
             --concurrency=2"

volumes:
  pg_data:

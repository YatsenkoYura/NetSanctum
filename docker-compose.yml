x-app-build: &app-build
  context: .
  args:
    NETSANCTUM_MODULES: ${NETSANCTUM_MODULES:-default}
    NETSANCTUM_EXTERNAL_MODULES: ${NETSANCTUM_EXTERNAL_MODULES:-}
    APP_UID: ${PUID:-1000}
    APP_GID: ${PGID:-1000}

services:
  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── YouTube proof-of-origin tokens ─────────────────────
  youtube-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno@sha256:bea3cfda79245700d7ad90500052b4358b1c1828fdc0961929624b83933121bc
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - media-control
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - const connection = await Deno.connect({hostname:'127.0.0.1',port:4416}); connection.close();
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Isolated on-demand Chromium runtime ────────────────
  browser-runtime:
    profiles: ["browser"]
    build:
      context: .
      args:
        NETSANCTUM_MODULES: core
        NETSANCTUM_EXTERNAL_MODULES: ""
        INSTALL_BROWSER_RUNTIME: "1"
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    restart: unless-stopped
    init: true
    environment:
      NETSANCTUM_LOAD_DOTENV: "0"
      HOME: /tmp
      BROWSER_PROXY_URL: http://browser-proxy:8888
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - seccomp=./docker/browser-seccomp.json
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    networks:
      - browser-control
      - browser-proxy
    depends_on:
      browser-proxy:
        condition: service_healthy
    command:
      - uvicorn
      - app.core.browser_worker:app
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Domain-restricted browser egress ───────────────────
  browser-proxy:
    profiles: ["browser"]
    build:
      context: .
      args:
        NETSANCTUM_MODULES: core
        NETSANCTUM_EXTERNAL_MODULES: ""
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    restart: unless-stopped
    init: true
    environment:
      NETSANCTUM_LOAD_DOTENV: "0"
      BROWSER_EGRESS_HOSTS: ${BROWSER_EGRESS_HOSTS:-google.com,googleapis.com,googleusercontent.com,ggpht.com,gstatic.com,recaptcha.net,youtube.com,youtube-nocookie.com,ytimg.com,googlevideo.com}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    networks:
      - browser-proxy
      - browser-egress
    command:
      - python
      - -m
      - app.core.browser_egress_proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8888),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Isolated agent runtime (cascade executor) ───────────
  agent-runtime:
    profiles: ["agent"]
    # Same image as web: the runtime needs the full dependency set, not the miku-only one.
    image: netsanctum-app
    restart: unless-stopped
    init: true
    environment:
      NETSANCTUM_LOAD_DOTENV: "0"
      AGENT_RUNTIME_TOKEN: ${AGENT_RUNTIME_TOKEN:-}
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:-}
      AGENT_WEB_URL: http://web:8000
      AGENT_CONSUMER_ID: ${AGENT_CONSUMER_ID:-miku}
      # local mode points at the in-network model service unless an external API is set
      AGENT_LLM_URL: ${MIKU_LLM_URL:-http://miku-llm:8080/v1}
      AGENT_LLM_MODEL: ${MIKU_LLM_MODEL:-local}
      AGENT_LLM_API_KEY: ${MIKU_LLM_API_KEY:-}
      AGENT_LLM_THINKING: ${AGENT_LLM_THINKING:-1}
      AGENT_STT_URL: ${MIKU_STT_URL:-http://miku-voice:8080/v1}
      AGENT_STT_MODEL: ${MIKU_STT_MODEL:-whisper-1}
      AGENT_STT_API_KEY: ${MIKU_STT_API_KEY:-}
      AGENT_TTS_URL: ${MIKU_TTS_URL:-http://miku-voice:8080/v1}
      AGENT_TTS_MODEL: ${MIKU_TTS_MODEL:-local}
      AGENT_TTS_API_KEY: ${MIKU_TTS_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    networks:
      - agent-control
      - model-control
      - agent-egress
    command:
      - uvicorn
      - app.core.agent_runtime:app
      - --host
      - 0.0.0.0
      - --port
      - "8780"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Fetches the model on first run, then exits ────────
  model-init:
    profiles: ["miku-local"]
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    user: "0:0"
    restart: "no"
    environment:
      MODEL_FILE: ${MIKU_MODEL_FILE:-}
      MODEL_URL: ${MIKU_MODEL_URL:-}
      MODELS_DIR: /models
      TARGET_UID: ${PUID:-1000}
      TARGET_GID: ${PGID:-1000}
    volumes:
      - ${MIKU_MODEL_DIR:-./storage/models}:/models
      - ./scripts/fetch_model.sh:/fetch-model.sh:ro
    entrypoint:
      - sh
      - /fetch-model.sh

  # ── Optional local MIKU language model ─────────────────
  miku-llm:
    profiles: ["miku-local"]
    image: ghcr.io/ggml-org/llama.cpp@sha256:e3ec7c0cd473df7dfff299a60a0f292bf5c3e6a5202286484f896819eca6d6ed
    restart: unless-stopped
    init: true
    # Without a writable shader cache the Vulkan backend refuses to start and the
    # model silently falls back to CPU, which is 20x slower. tmpfs keeps it safe.
    environment:
      XDG_CACHE_HOME: /tmp/.cache
      HOME: /tmp
    volumes:
      - ${MIKU_MODEL_DIR:-./storage/models}:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 6g
    cpus: ${MIKU_LLM_CPUS:-4}
    pids_limit: 128
    networks:
      - model-control
    depends_on:
      model-init:
        condition: service_completed_successfully
    command:
      - -m
      - /models/${MIKU_MODEL_FILE:-model.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${MIKU_LLM_CTX:-8192}"
      - --parallel
      - "1"
      - --threads
      - "${MIKU_LLM_THREADS:-4}"
      - --threads-batch
      - "${MIKU_LLM_THREADS:-4}"
      - --batch-size
      - "256"
      - --ubatch-size
      - "128"
      # Let llama.cpp fit the model into whatever the device has free instead of
      # pinning 99 layers, which aborts offload and drops the whole run to CPU.
      - --fit
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      # The cascade re-sends the same system prompt and tool schemas every step;
      # reusing the prefix KV cache is what makes a multi-step turn bearable.
      - --cache-reuse
      - "256"
      # A small model spends hundreds of tokens thinking before every tool call, and
      # the cascade already guards the loop, so reasoning is kept short on purpose.
      - --reasoning-effort
      - low

  # ── Optional server-side voice (opt-in: ./start.sh --voice) ──
  # Recognition and synthesis live here rather than in the web process, so choosing
  # the browser's own speech support really does cost the server nothing: the profile
  # is stopped and removed, not merely bypassed. Both services share one network and
  # are reachable only by the isolated agent runtime.
  miku-voice:
    profiles: ["voice"]
    build:
      context: .
      dockerfile: docker/voice/Dockerfile
      target: voice
      args:
        WHISPER_VERSION: ${WHISPER_VERSION:-v1.9.4}
    image: netsanctum-voice:latest
    restart: unless-stopped
    init: true
    environment:
      VOICE_MODEL_DIR: /models
      VOICE_STT_URL: http://miku-stt:8080
      # One model at a time keeps the stack inside its memory budget: the Russian
      # engine needs torch, and holding both languages resident doubles it. Raising
      # this to 2 pre-loads the second language too, for roughly 200 MB more.
      VOICE_MAX_RESIDENT: ${VOICE_MAX_RESIDENT:-1}
      VOICE_LANG_DEFAULT: ru
      # The character voice stage. Off until a conversion runtime is installed.
      VOICE_TIMBRE: ${VOICE_TIMBRE:-0}
    volumes:
      - ${MIKU_VOICE_MODEL_DIR:-./storage/voice-models}:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1200m
    cpus: ${VOICE_CPUS:-3}
    pids_limit: 256
    networks:
      - model-control
    depends_on:
      voice-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  miku-stt:
    profiles: ["voice"]
    build:
      context: .
      dockerfile: docker/voice/Dockerfile
      target: stt
      args:
        WHISPER_VERSION: ${WHISPER_VERSION:-v1.9.4}
    image: netsanctum-stt:latest
    restart: unless-stopped
    init: true
    environment:
      MODEL_FILE: ${MIKU_STT_MODEL_FILE:-ggml-base.bin}
    volumes:
      - ${MIKU_VOICE_MODEL_DIR:-./storage/voice-models}:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 500m
    cpus: ${VOICE_CPUS:-3}
    pids_limit: 128
    networks:
      - model-control
    depends_on:
      voice-init:
        condition: service_completed_successfully
    command:
      - /opt/whisper/bin/whisper-server
      - --model
      - /models/${MIKU_STT_MODEL_FILE:-ggml-base.bin}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --threads
      - ${VOICE_THREADS:-4}
      - --language
      - auto
      - --no-timestamps

  # ── One-time voice model fetch, then exits ─────────────
  voice-init:
    profiles: ["voice"]
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    user: "0:0"
    restart: "no"
    environment:
      MODELS_DIR: /models
      VOICE_FETCH_TIMBRE: ${VOICE_FETCH_TIMBRE:-0}
      # The character voice: 1 GB of weights for a stage with no conversion
      # runtime installed, so it is fetched only when asked for. The preset is
      # published inside the zip rather than as a separate file, hence the archive
      # name and the member the service reads.
      VOICE_TIMBRE_MANIFEST: |
        miku_default_rvc.zip|https://huggingface.co/aple/HatsuneMikuRVC/resolve/main/miku_default_rvc.zip|PK
        hubert_base_layer12_32000.onnx|https://huggingface.co/ohnoitsaninja/rvc-base-onnx/resolve/main/onnx/hubert_base_layer12_32000.onnx|ONNX
        rmvpe.onnx|https://huggingface.co/ohnoitsaninja/rvc-base-onnx/resolve/main/assets/rmvpe.onnx|ONNX
      # One file per line: name, url, magic. A proxy that answers with an error page
      # instead of the model is caught by the magic check rather than installed.
      # Recognition is the multilingual base, never the .en variant: both are the
      # same container, and only the multilingual one is usable in Russian.
      VOICE_MANIFEST: |
        ggml-base.bin|https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin|GGML
        v5_ru_ru.pt|https://models.silero.ai/models/tts/ru/v5_ru.pt|PK
        kokoro-v1.0.int8.onnx|https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx|ONNX
        voices-v1.0.bin|https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin|PK
    volumes:
      - ${MIKU_VOICE_MODEL_DIR:-./storage/voice-models}:/models
      - ./scripts/fetch_model.sh:/fetch-model.sh:ro
    entrypoint:
      - sh
      - -c
      - |
        sh /fetch-model.sh --manifest VOICE_MANIFEST
        # A missing character voice is not a failed startup: the stage is off by
        # default and the service reports that it is off.
        if [ "$$VOICE_FETCH_TIMBRE" = "1" ]; then
            VOICE_MANIFEST="$$VOICE_TIMBRE_MANIFEST" sh /fetch-model.sh --manifest VOICE_MANIFEST
        fi

  # ── One-time storage ownership migration ───────────────
  storage-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    user: "0:0"
    restart: "no"
    environment:
      TARGET_UID: ${PUID:-1000}
      TARGET_GID: ${PGID:-1000}
    volumes:
      - ./storage:/app/storage
      - encryption_key:/run/netsanctum-key
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -ec
      - |
        mkdir -p /app/storage/config
        key_file=/run/netsanctum-key/file.key
        key_marker=/app/storage/config/encryption-key.sha256
        if [ ! -s "$$key_file" ]; then
          if [ -s "$$key_marker" ]; then
            echo "Encryption key volume is missing; restore it from backup." >&2
            exit 1
          fi
          umask 077
          head -c 48 /dev/urandom | base64 > "$$key_file"
        fi
        chown "$${TARGET_UID}:$${TARGET_GID}" "$$key_file"
        chmod 400 "$$key_file"
        if [ -f /run/netsanctum-key/legacy.keys ]; then
          chown "$${TARGET_UID}:$${TARGET_GID}" /run/netsanctum-key/legacy.keys
          chmod 400 /run/netsanctum-key/legacy.keys
        fi
        fingerprint="$$(sha256sum "$$key_file" | cut -d ' ' -f1)"
        if [ -s "$$key_marker" ]; then
          read -r stored_fingerprint < "$$key_marker"
          if [ "$$stored_fingerprint" != "$$fingerprint" ]; then
            echo "Encryption key does not match this storage." >&2
            exit 1
          fi
        else
          printf '%s\n' "$$fingerprint" > "$$key_marker"
        fi
        chown "$${TARGET_UID}:$${TARGET_GID}" "$$key_marker"
        chmod 600 "$$key_marker"
        marker="/app/storage/config/.owner-v2-$${TARGET_UID}-$${TARGET_GID}"
        if [ ! -f "$$marker" ]; then
          chown -R "$${TARGET_UID}:$${TARGET_GID}" /app/storage
          rm -f /app/storage/config/.owner-*
          chmod -R go-rwx /app/storage
          touch "$$marker"
          chown "$${TARGET_UID}:$${TARGET_GID}" "$$marker"
        fi
        chmod 700 /app/storage/config
        for name in access_token.hash access_token.txt enabled-modules.json; do
          if [ -f "/app/storage/config/$$name" ]; then
            chmod 600 "/app/storage/config/$$name"
          fi
        done

  # ── One-shot schema migration ──────────────────────────
  migrate:
    image: netsanctum-app
    build: *app-build
    restart: "no"
    env_file: .env
    environment:
      NETSANCTUM_PROCESS_ROLE: migrate
      NETSANCTUM_LOAD_DOTENV: "0"
      NETSANCTUM_ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      FILE_ENCRYPTION_KEY_PATH: /run/netsanctum-key/file.key
      LEGACY_FILE_ENCRYPTION_KEYS_PATH: /run/netsanctum-key/legacy.keys
    volumes:
      - ./storage:/app/storage
      - encryption_key:/run/netsanctum-key:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.core.migrations", "upgrade"]

  # ── FastAPI Web Server ─────────────────────────────────
  web:
    image: netsanctum-app
    build: *app-build
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NETSANCTUM_PROCESS_ROLE: web
      NETSANCTUM_LOAD_DOTENV: "0"
      NETSANCTUM_ENVIRONMENT: production
      FILE_ENCRYPTION_KEY_PATH: /run/netsanctum-key/file.key
      LEGACY_FILE_ENCRYPTION_KEYS_PATH: /run/netsanctum-key/legacy.keys
      YOUTUBE_POT_PROVIDER_URL: ${YOUTUBE_POT_PROVIDER_URL:-http://youtube-pot:4416}
      BROWSER_RUNTIME_URL: http://browser-runtime:8765
      BROWSER_RUNTIME_ENABLED: ${BROWSER_RUNTIME_ENABLED:-1}
      AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-1}
      AGENT_RUNTIME_URL: http://agent-runtime:8780
      AGENT_RUNTIME_TOKEN: ${AGENT_RUNTIME_TOKEN:-}
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:-}
      AGENT_CONSUMER_ID: ${AGENT_CONSUMER_ID:-miku}
      # The agent runtime calls web by service name; host header validation must allow it.
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,testserver},web
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      - ./storage:/app/storage
      - encryption_key:/run/netsanctum-key:ro
    networks:
      - default
      - backend
      - media-control
      - browser-control
      - agent-control
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      youtube-pot:
        condition: service_healthy
      browser-runtime:
        condition: service_healthy
        required: false
      agent-runtime:
        condition: service_healthy
        required: false
    command:
      - sh
      - -c
      - umask 077 && python -c 'from app.core.config import validate_runtime_security; validate_runtime_security()' && exec uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ── Celery Worker ──────────────────────────────────────
  worker:
    image: netsanctum-app
    build: *app-build
    restart: unless-stopped
    env_file: .env
    environment:
      NETSANCTUM_PROCESS_ROLE: worker
      NETSANCTUM_LOAD_DOTENV: "0"
      NETSANCTUM_ENVIRONMENT: production
      FILE_ENCRYPTION_KEY_PATH: /run/netsanctum-key/file.key
      LEGACY_FILE_ENCRYPTION_KEYS_PATH: /run/netsanctum-key/legacy.keys
      YOUTUBE_POT_PROVIDER_URL: ${YOUTUBE_POT_PROVIDER_URL:-http://youtube-pot:4416}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    volumes:
      - ./storage:/app/storage
      - encryption_key:/run/netsanctum-key:ro
    networks:
      - default
      - backend
      - media-control
    read_only: true
    tmpfs:
      - /tmp:size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      youtube-pot:
        condition: service_healthy
    command:
      - sh
      - -c
      - umask 077 && python -c 'from app.core.config import validate_runtime_security; validate_runtime_security()' && exec celery -A app.core.scheduler:celery_app worker --loglevel=info --concurrency=2
    stop_grace_period: 10m

volumes:
  pg_data:
  redis_data:
  encryption_key:

networks:
  backend:
    internal: true
  media-control:
  browser-control:
    internal: true
  browser-proxy:
    internal: true
  agent-control:
    internal: true
  model-control:
    internal: true
  browser-egress:
  agent-egress:

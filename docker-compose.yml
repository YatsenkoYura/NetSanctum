services:
  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── YouTube proof-of-origin tokens ─────────────────────
  youtube-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno@sha256:bea3cfda79245700d7ad90500052b4358b1c1828fdc0961929624b83933121bc
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - const connection = await Deno.connect({hostname:'127.0.0.1',port:4416}); connection.close();
      interval: 10s
      timeout: 5s
      retries: 5

  # ── One-time storage ownership migration ───────────────
  storage-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    user: "0:0"
    restart: "no"
    environment:
      TARGET_UID: ${PUID:-1000}
      TARGET_GID: ${PGID:-1000}
    volumes:
      - ./storage:/app/storage
      - encryption_key:/run/netsanctum-key
    read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -ec
      - |
        mkdir -p /app/storage/config
        key_file=/run/netsanctum-key/file.key
        key_marker=/app/storage/config/encryption-key.sha256
        if [ ! -s "$$key_file" ]; then
          if [ -s "$$key_marker" ]; then
            echo "Encryption key volume is missing; restore it from backup." >&2
            exit 1
          fi
          umask 077
          head -c 48 /dev/urandom | base64 > "$$key_file"
        fi
        chown "$${TARGET_UID}:$${TARGET_GID}" "$$key_file"
        chmod 400 "$$key_file"
        if [ -f /run/netsanctum-key/legacy.keys ]; then
          chown "$${TARGET_UID}:$${TARGET_GID}" /run/netsanctum-key/legacy.keys
          chmod 400 /run/netsanctum-key/legacy.keys
        fi
        fingerprint="$$(sha256sum "$$key_file" | cut -d ' ' -f1)"
        if [ -s "$$key_marker" ]; then
          read -r stored_fingerprint < "$$key_marker"
          if [ "$$stored_fingerprint" != "$$fingerprint" ]; then
            echo "Encryption key does not match this storage." >&2
            exit 1
          fi
        else
          printf '%s\n' "$$fingerprint" > "$$key_marker"
        fi
        chown "$${TARGET_UID}:$${TARGET_GID}" "$$key_marker"
        chmod 600 "$$key_marker"
        marker="/app/storage/config/.owner-v2-$${TARGET_UID}-$${TARGET_GID}"
        if [ ! -f "$$marker" ]; then
          chown -R "$${TARGET_UID}:$${TARGET_GID}" /app/storage
          rm -f /app/storage/config/.owner-*
          chmod -R go-rwx /app/storage
          touch "$$marker"
          chown "$${TARGET_UID}:$${TARGET_GID}" "$$marker"
        fi
        chmod 700 /app/storage/config
        for name in access_token.hash access_token.txt enabled-modules.json; do
          if [ -f "/app/storage/config/$$name" ]; then
            chmod 600 "/app/storage/config/$$name"
          fi
        done

  # ── FastAPI Web Server ─────────────────────────────────
  web:
    build:
      context: .
      args:
        NETSANCTUM_MODULES: ${NETSANCTUM_MODULES:-default}
        NETSANCTUM_EXTERNAL_MODULES: ${NETSANCTUM_EXTERNAL_MODULES:-}
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    restart: unless-stopped
    env_file: .env
    environment:
      NETSANCTUM_PROCESS_ROLE: web
      NETSANCTUM_LOAD_DOTENV: "0"
      NETSANCTUM_ENVIRONMENT: production
      FILE_ENCRYPTION_KEY_PATH: /run/netsanctum-key/file.key
      LEGACY_FILE_ENCRYPTION_KEYS_PATH: /run/netsanctum-key/legacy.keys
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      - ./storage:/app/storage
      - encryption_key:/run/netsanctum-key:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - umask 077 && python -c 'from app.core.config import validate_runtime_security; validate_runtime_security()' && python -m app.core.migrations upgrade && exec uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ── Celery Worker ──────────────────────────────────────
  worker:
    build:
      context: .
      args:
        NETSANCTUM_MODULES: ${NETSANCTUM_MODULES:-default}
        NETSANCTUM_EXTERNAL_MODULES: ${NETSANCTUM_EXTERNAL_MODULES:-}
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    restart: unless-stopped
    env_file: .env
    environment:
      NETSANCTUM_PROCESS_ROLE: worker
      NETSANCTUM_LOAD_DOTENV: "0"
      NETSANCTUM_ENVIRONMENT: production
      FILE_ENCRYPTION_KEY_PATH: /run/netsanctum-key/file.key
      LEGACY_FILE_ENCRYPTION_KEYS_PATH: /run/netsanctum-key/legacy.keys
      YOUTUBE_POT_PROVIDER_URL: ${YOUTUBE_POT_PROVIDER_URL:-http://youtube-pot:4416}
    volumes:
      - ./storage:/app/storage
      - encryption_key:/run/netsanctum-key:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      youtube-pot:
        condition: service_healthy
    command:
      - sh
      - -c
      - umask 077 && python -c 'from app.core.config import validate_runtime_security; validate_runtime_security()' && python -m app.core.migrations upgrade && exec celery -A app.core.scheduler:celery_app worker --loglevel=info --concurrency=2

volumes:
  pg_data:
  encryption_key:

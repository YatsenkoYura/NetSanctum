x-app-build: &app-build
  context: .
  args:
    NETSANCTUM_MODULES: ${NETSANCTUM_MODULES:-default}
    NETSANCTUM_EXTERNAL_MODULES: ${NETSANCTUM_EXTERNAL_MODULES:-}
    APP_UID: ${PUID:-1000}
    APP_GID: ${PGID:-1000}

services:
  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── YouTube proof-of-origin tokens ─────────────────────
  youtube-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno@sha256:bea3cfda79245700d7ad90500052b4358b1c1828fdc0961929624b83933121bc
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - media-control
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - const connection = await Deno.connect({hostname:'127.0.0.1',port:4416}); connection.close();
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Isolated on-demand Chromium runtime ────────────────
  browser-runtime:
    profiles: ["browser"]
    build:
      context: .
      args:
        NETSANCTUM_MODULES: core
        NETSANCTUM_EXTERNAL_MODULES: ""
        INSTALL_BROWSER_RUNTIME: "1"
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    restart: unless-stopped
    init: true
    environment:
      NETSANCTUM_LOAD_DOTENV: "0"
      HOME: /tmp
      BROWSER_PROXY_URL: http://browser-proxy:8888
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - seccomp=./docker/browser-seccomp.json
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    networks:
      - browser-control
      - browser-proxy
    depends_on:
      browser-proxy:
        condition: service_healthy
    command:
      - uvicorn
      - app.core.browser_worker:app
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Domain-restricted browser egress ───────────────────
  browser-proxy:
    profiles: ["browser"]
    build:
      context: .
      args:
        NETSANCTUM_MODULES: core
        NETSANCTUM_EXTERNAL_MODULES: ""
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    restart: unless-stopped
    init: true
    environment:
      NETSANCTUM_LOAD_DOTENV: "0"
      BROWSER_EGRESS_HOSTS: ${BROWSER_EGRESS_HOSTS:-google.com,googleapis.com,googleusercontent.com,ggpht.com,gstatic.com,recaptcha.net,youtube.com,youtube-nocookie.com,ytimg.com,googlevideo.com}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    networks:
      - browser-proxy
      - browser-egress
    command:
      - python
      - -m
      - app.core.browser_egress_proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8888),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Isolated MIKU cognition and voice runtime ──────────
  miku-runtime:
    profiles: ["miku"]
    image: netsanctum-miku-runtime
    build:
      context: .
      args:
        NETSANCTUM_MODULES: miku
        NETSANCTUM_EXTERNAL_MODULES: ""
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    restart: unless-stopped
    init: true
    environment:
      NETSANCTUM_LOAD_DOTENV: "0"
      MIKU_RUNTIME_TOKEN: ${MIKU_RUNTIME_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    networks:
      - miku-control
    command:
      - uvicorn
      - app.modules.miku.runtime_worker:app
      - --host
      - 0.0.0.0
      - --port
      - "8770"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── One-time storage ownership migration ───────────────
  storage-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    user: "0:0"
    restart: "no"
    environment:
      TARGET_UID: ${PUID:-1000}
      TARGET_GID: ${PGID:-1000}
    volumes:
      - ./storage:/app/storage
      - encryption_key:/run/netsanctum-key
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -ec
      - |
        mkdir -p /app/storage/config
        key_file=/run/netsanctum-key/file.key
        key_marker=/app/storage/config/encryption-key.sha256
        if [ ! -s "$$key_file" ]; then
          if [ -s "$$key_marker" ]; then
            echo "Encryption key volume is missing; restore it from backup." >&2
            exit 1
          fi
          umask 077
          head -c 48 /dev/urandom | base64 > "$$key_file"
        fi
        chown "$${TARGET_UID}:$${TARGET_GID}" "$$key_file"
        chmod 400 "$$key_file"
        if [ -f /run/netsanctum-key/legacy.keys ]; then
          chown "$${TARGET_UID}:$${TARGET_GID}" /run/netsanctum-key/legacy.keys
          chmod 400 /run/netsanctum-key/legacy.keys
        fi
        fingerprint="$$(sha256sum "$$key_file" | cut -d ' ' -f1)"
        if [ -s "$$key_marker" ]; then
          read -r stored_fingerprint < "$$key_marker"
          if [ "$$stored_fingerprint" != "$$fingerprint" ]; then
            echo "Encryption key does not match this storage." >&2
            exit 1
          fi
        else
          printf '%s\n' "$$fingerprint" > "$$key_marker"
        fi
        chown "$${TARGET_UID}:$${TARGET_GID}" "$$key_marker"
        chmod 600 "$$key_marker"
        marker="/app/storage/config/.owner-v2-$${TARGET_UID}-$${TARGET_GID}"
        if [ ! -f "$$marker" ]; then
          chown -R "$${TARGET_UID}:$${TARGET_GID}" /app/storage
          rm -f /app/storage/config/.owner-*
          chmod -R go-rwx /app/storage
          touch "$$marker"
          chown "$${TARGET_UID}:$${TARGET_GID}" "$$marker"
        fi
        chmod 700 /app/storage/config
        for name in access_token.hash access_token.txt enabled-modules.json; do
          if [ -f "/app/storage/config/$$name" ]; then
            chmod 600 "/app/storage/config/$$name"
          fi
        done

  # ── One-shot schema migration ──────────────────────────
  migrate:
    image: netsanctum-app
    build: *app-build
    restart: "no"
    env_file: .env
    environment:
      NETSANCTUM_PROCESS_ROLE: migrate
      NETSANCTUM_LOAD_DOTENV: "0"
      NETSANCTUM_ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      FILE_ENCRYPTION_KEY_PATH: /run/netsanctum-key/file.key
      LEGACY_FILE_ENCRYPTION_KEYS_PATH: /run/netsanctum-key/legacy.keys
    volumes:
      - ./storage:/app/storage
      - encryption_key:/run/netsanctum-key:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.core.migrations", "upgrade"]

  # ── FastAPI Web Server ─────────────────────────────────
  web:
    image: netsanctum-app
    build: *app-build
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NETSANCTUM_PROCESS_ROLE: web
      NETSANCTUM_LOAD_DOTENV: "0"
      NETSANCTUM_ENVIRONMENT: production
      FILE_ENCRYPTION_KEY_PATH: /run/netsanctum-key/file.key
      LEGACY_FILE_ENCRYPTION_KEYS_PATH: /run/netsanctum-key/legacy.keys
      YOUTUBE_POT_PROVIDER_URL: ${YOUTUBE_POT_PROVIDER_URL:-http://youtube-pot:4416}
      BROWSER_RUNTIME_URL: http://browser-runtime:8765
      BROWSER_RUNTIME_ENABLED: ${BROWSER_RUNTIME_ENABLED:-1}
      MIKU_RUNTIME_URL: http://miku-runtime:8770
      MIKU_RUNTIME_ENABLED: ${MIKU_RUNTIME_ENABLED:-0}
      MIKU_RUNTIME_TOKEN: ${MIKU_RUNTIME_TOKEN:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      - ./storage:/app/storage
      - encryption_key:/run/netsanctum-key:ro
    networks:
      - default
      - backend
      - media-control
      - browser-control
      - miku-control
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      youtube-pot:
        condition: service_healthy
      browser-runtime:
        condition: service_healthy
        required: false
      miku-runtime:
        condition: service_healthy
        required: false
    command:
      - sh
      - -c
      - umask 077 && python -c 'from app.core.config import validate_runtime_security; validate_runtime_security()' && exec uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ── Celery Worker ──────────────────────────────────────
  worker:
    image: netsanctum-app
    build: *app-build
    restart: unless-stopped
    env_file: .env
    environment:
      NETSANCTUM_PROCESS_ROLE: worker
      NETSANCTUM_LOAD_DOTENV: "0"
      NETSANCTUM_ENVIRONMENT: production
      FILE_ENCRYPTION_KEY_PATH: /run/netsanctum-key/file.key
      LEGACY_FILE_ENCRYPTION_KEYS_PATH: /run/netsanctum-key/legacy.keys
      YOUTUBE_POT_PROVIDER_URL: ${YOUTUBE_POT_PROVIDER_URL:-http://youtube-pot:4416}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    volumes:
      - ./storage:/app/storage
      - encryption_key:/run/netsanctum-key:ro
    networks:
      - default
      - backend
      - media-control
    read_only: true
    tmpfs:
      - /tmp:size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      youtube-pot:
        condition: service_healthy
    command:
      - sh
      - -c
      - umask 077 && python -c 'from app.core.config import validate_runtime_security; validate_runtime_security()' && exec celery -A app.core.scheduler:celery_app worker --loglevel=info --concurrency=2
    stop_grace_period: 10m

volumes:
  pg_data:
  redis_data:
  encryption_key:

networks:
  backend:
    internal: true
  media-control:
  browser-control:
    internal: true
  browser-proxy:
    internal: true
  miku-control:
    internal: true
  browser-egress:

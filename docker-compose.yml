services:
  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── YouTube proof-of-origin tokens ─────────────────────
  youtube-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno@sha256:bea3cfda79245700d7ad90500052b4358b1c1828fdc0961929624b83933121bc
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - const connection = await Deno.connect({hostname:'127.0.0.1',port:4416}); connection.close();
      interval: 10s
      timeout: 5s
      retries: 5

  # ── One-time storage ownership migration ───────────────
  storage-init:
    image: alpine:3.20
    user: "0:0"
    restart: "no"
    environment:
      TARGET_UID: ${PUID:-1000}
      TARGET_GID: ${PGID:-1000}
    volumes:
      - .:/repo:ro
      - ./storage:/app/storage
    read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -ec
      - |
        mkdir -p /app/storage/config
        for name in access_token.hash access_token.txt; do
          if [ -f "/repo/$$name" ] && [ ! -f "/app/storage/config/$$name" ]; then
            cp "/repo/$$name" "/app/storage/config/$$name"
          fi
        done
        marker="/app/storage/config/.owner-$${TARGET_UID}-$${TARGET_GID}"
        if [ ! -f "$$marker" ]; then
          chown -R "$${TARGET_UID}:$${TARGET_GID}" /app/storage
          rm -f /app/storage/config/.owner-*
          touch "$$marker"
          chown "$${TARGET_UID}:$${TARGET_GID}" "$$marker"
        fi
        chmod 700 /app/storage/config
        for name in access_token.hash access_token.txt enabled-modules.json; do
          if [ -f "/app/storage/config/$$name" ]; then
            chmod 600 "/app/storage/config/$$name"
          fi
        done

  # ── FastAPI Web Server ─────────────────────────────────
  web:
    build:
      context: .
      args:
        NETSANCTUM_MODULES: ${NETSANCTUM_MODULES:-default}
        NETSANCTUM_EXTERNAL_MODULES: ${NETSANCTUM_EXTERNAL_MODULES:-}
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    restart: unless-stopped
    env_file: .env
    environment:
      NETSANCTUM_PROCESS_ROLE: web
      NETSANCTUM_LOAD_DOTENV: "0"
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      - .:/app:ro
      - ./storage:/app/storage
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m app.core.migrations upgrade && exec uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ── Celery Worker ──────────────────────────────────────
  worker:
    build:
      context: .
      args:
        NETSANCTUM_MODULES: ${NETSANCTUM_MODULES:-default}
        NETSANCTUM_EXTERNAL_MODULES: ${NETSANCTUM_EXTERNAL_MODULES:-}
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    restart: unless-stopped
    env_file: .env
    environment:
      NETSANCTUM_PROCESS_ROLE: worker
      NETSANCTUM_LOAD_DOTENV: "0"
      YOUTUBE_POT_PROVIDER_URL: ${YOUTUBE_POT_PROVIDER_URL:-http://youtube-pot:4416}
    volumes:
      - .:/app:ro
      - ./storage:/app/storage
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      youtube-pot:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m app.core.migrations upgrade && exec celery -A app.core.scheduler:celery_app worker --loglevel=info --concurrency=2

volumes:
  pg_data:

name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-format:
    name: Code Lint & Format Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.11.18'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - name: Verify Compiled CSS
      run: |
        npm ci
        npm run build:css
        git diff --exit-code -- static/tailwind.css

    - name: Verify Dependency Lock
      run: uv lock --check

    - name: Verify Wheel Migration Runtime
      run: |
        uv build --wheel
        python -c "import glob, zipfile; names=set(zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()); assert 'netsanctum_alembic/env.py' in names; assert 'netsanctum_alembic/module_env/env.py' in names; assert any(name.startswith('netsanctum_alembic/versions/') for name in names)"

    - name: Verify Module Build Catalog
      run: python scripts/module_build.py check

    - name: Run Ruff Format Check
      run: uvx --from ruff==0.15.17 ruff format --check .

    - name: Run Ruff Linter
      run: uvx --from ruff==0.15.17 ruff check .

  docker-build:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - profile: full
          modules: default
        - profile: core
          modules: core

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        build-args: NETSANCTUM_MODULES=${{ matrix.modules }}
        push: false
        load: true
        tags: netsanctum:${{ matrix.profile }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Regression Tests
      if: matrix.profile == 'full'
      run: docker run --rm netsanctum:full python -m unittest discover -s tests -v

    - name: Verify Core-Only Image
      if: matrix.profile == 'core'
      run: >-
        docker run --rm netsanctum:core python -c
        "import importlib.util;
        from app.core.modules import module_registry;
        assert module_registry.is_active('auth');
        assert module_registry.is_active('settings');
        assert not module_registry.is_installed('music');
        assert importlib.util.find_spec('yt_dlp') is None;
        assert importlib.util.find_spec('openai') is None;
        assert importlib.util.find_spec('requests') is None"

  migration-compatibility:
    name: Migration Compatibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netsanctum
          POSTGRES_PASSWORD: test
          POSTGRES_DB: netsanctum_test
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netsanctum -d netsanctum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_SYNC: postgresql+psycopg2://netsanctum:test@localhost:5432/netsanctum_test
      MIGRATION_TEST_DATABASE_URL: postgresql+psycopg2://netsanctum:test@localhost:5432/netsanctum_test
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.11.18'

    - name: Install Dependencies
      run: uv sync --locked

    - name: Verify Fresh and Legacy Migrations
      run: uv run python -m unittest tests.test_migrations.PostgresMigrationSmokeTests -v

[project]
name = "netsanctum"
version = "0.1.0"
description = "A single-user, self-hosted runtime for independent web modules."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.15.2",
    "asyncpg==0.30.0",
    "bcrypt==4.3.0",
    "boto3==1.38.29",
    "celery==5.5.2",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "passlib[bcrypt]==1.7.4",
    "psycopg2-binary==2.9.10",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.31",
    "redis==8.1.0",
    "sqlalchemy==2.0.41",
    "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
alllib = [
    "anicli-api==0.9.2",
    "requests==2.33.0",
]
music = [
    "bgutil-ytdlp-pot-provider==1.3.1",
    "openai==1.59.3",
    "requests==2.33.0",
    "yt-dlp[curl-cffi,default]==2026.8.18.122307.dev0",
]
video_archiver = [
    "bgutil-ytdlp-pot-provider==1.3.1",
    "requests==2.33.0",
    "yt-dlp[curl-cffi,default]==2026.8.18.122307.dev0",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "ruff==0.15.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "netsanctum_alembic"

[tool.ruff]
# Target Python version
target-version = "py312"
line-length = 110

[tool.ruff.lint]
# Rules: Pyflakes (F), Pycodestyle (E, W), Isort (I), Pep8-naming (N),
# Pyupgrade (UP), Bugbear (B), Comprehensions (C4), Ruff-specific (RUF)
select = [
    "F",    # Pyflakes
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "I",    # Isort (imports sorting)
    "N",    # Pep8 naming conventions
    "UP",   # Pyupgrade (suggest modern syntax)
    "B",    # Bugbear (detect common design bugs)
    "C4",   # Comprehensions
    "RUF"   # Ruff custom rules
]

ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # Do not perform function calls in argument defaults (FastAPI Depends uses this)
    "RUF001", # Cyrillic letter warnings (false positives in i18n files)
    "RUF002", # Cyrillic letter warnings (false positives in i18n files)
    "RUF003", # Cyrillic letter warnings (false positives in i18n files)
    "E402",   # Module level import not at top of file
    "B904"    # Within an except clause, raise exceptions with raise ... from err
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

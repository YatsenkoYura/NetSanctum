{% extends "base.html" %}

{% block title %}Sharing | NetSanctum{% endblock %}

{% block content %}
<div class="mx-auto max-w-6xl space-y-6 py-4">
    <div class="border-2 border-zinc-800 bg-zinc-950 p-5">
        <div class="font-mono text-[10px] uppercase tracking-[0.3em] text-teal-400">Access control</div>
        <h1 class="mt-2 text-2xl font-black text-white">Shared modules</h1>
        <p class="mt-2 max-w-2xl text-sm text-zinc-500">Publish a read-only module with all content or a selected subset.</p>
    </div>

    <form id="share-form" class="grid gap-4 border-2 border-zinc-800 bg-black p-5 md:grid-cols-2">
        <label class="space-y-2 text-xs font-mono uppercase text-zinc-500">Module
            <select id="share-module" class="w-full border border-zinc-700 bg-zinc-950 px-3 py-3 text-zinc-200"></select>
        </label>
        <label class="space-y-2 text-xs font-mono uppercase text-zinc-500">Title
            <input id="share-title" required class="w-full border border-zinc-700 bg-zinc-950 px-3 py-3 text-zinc-200">
        </label>
        <label class="space-y-2 text-xs font-mono uppercase text-zinc-500">Expiration
            <input id="share-expiration" type="datetime-local" class="w-full border border-zinc-700 bg-zinc-950 px-3 py-3 text-zinc-200">
        </label>
        <label class="space-y-2 text-xs font-mono uppercase text-zinc-500">Optional password
            <input id="share-password" type="password" maxlength="64" class="w-full border border-zinc-700 bg-zinc-950 px-3 py-3 text-zinc-200">
        </label>
        <div class="flex flex-wrap gap-5 md:col-span-2">
            <label class="flex items-center gap-2 text-xs font-mono uppercase text-zinc-400"><input id="share-all" type="checkbox"> Entire module</label>
            <label class="flex items-center gap-2 text-xs font-mono uppercase text-zinc-400"><input id="share-public" type="checkbox"> Public URL</label>
            <label class="flex items-center gap-2 text-xs font-mono uppercase text-zinc-400"><input id="share-download" type="checkbox"> Show download button</label>
        </div>
        <div class="md:col-span-2">
            <div class="mb-2 font-mono text-xs uppercase text-zinc-500">Content</div>
            <div id="share-content" class="grid max-h-80 gap-2 overflow-y-auto border border-zinc-800 bg-zinc-950 p-3 sm:grid-cols-2"></div>
        </div>
        <button id="create-share" class="border-2 border-teal-400 bg-teal-400 px-5 py-3 font-mono text-xs font-black uppercase text-black hover:bg-black hover:text-teal-400 disabled:cursor-wait disabled:opacity-40 md:col-span-2">Create link</button>
    </form>

    <div id="share-result" class="hidden border-2 border-teal-400 bg-teal-950/20 p-5"></div>
    <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
        <div>
            <h2 class="font-mono text-sm font-black uppercase text-white">Active shares</h2>
            <p class="mt-1 font-mono text-[10px] text-zinc-600">Only links that can still be opened are shown.</p>
        </div>
        <button id="revoke-all-shares" type="button"
                class="hidden border border-red-500/60 px-3 py-2 font-mono text-xs uppercase text-red-300 hover:border-red-400">
            Revoke all
        </button>
    </div>
    <div id="shares-list" class="space-y-3"></div>
</div>

<script>
    const moduleSelect = document.getElementById('share-module');
    const contentRoot = document.getElementById('share-content');
    const shareAll = document.getElementById('share-all');
    const russianUi = document.documentElement.lang.toLowerCase().startsWith('ru');
    let providersById = {};
    let contentGeneration = 0;

    function localizedTitle(item) {
        return russianUi ? item.title_ru : item.title_en;
    }

    function updateDefaultShareTitle() {
        const provider = providersById[moduleSelect.value];
        if (!provider) return;
        document.getElementById('share-title').value = russianUi
            ? `Общий доступ: ${localizedTitle(provider)}`
            : `Shared ${localizedTitle(provider)}`;
    }

    async function loadProviders() {
        const providers = await fetch('/api/shares/providers').then(r => r.json());
        providersById = Object.fromEntries(providers.map(provider => [provider.module_id, provider]));
        moduleSelect.replaceChildren(...providers.map(provider => {
            const option = document.createElement('option');
            option.value = provider.module_id;
            option.textContent = localizedTitle(provider);
            return option;
        }));
        if (providers.length) {
            updateDefaultShareTitle();
            await loadContent();
        }
    }

    async function loadContent() {
        const generation = ++contentGeneration;
        const moduleId = moduleSelect.value;
        const provider = providersById[moduleSelect.value];
        const submitButton = document.getElementById('create-share');
        submitButton.disabled = true;
        contentRoot.replaceChildren();
        contentRoot.classList.add('opacity-40');
        let items;
        try {
            const response = await fetch(`/api/shares/providers/${encodeURIComponent(moduleId)}/content`);
            if (!response.ok) throw new Error('Could not load shareable content');
            items = await response.json();
        } catch (error) {
            if (generation === contentGeneration) {
                const message = document.createElement('p');
                message.className = 'border border-red-900 p-3 font-mono text-xs text-red-400';
                message.textContent = error.message;
                const retry = document.createElement('button');
                retry.type = 'button';
                retry.className = 'border border-red-700 px-3 py-2 font-mono text-[10px] uppercase text-red-300';
                retry.textContent = 'Retry';
                retry.addEventListener('click', () => loadContent().catch(console.error));
                contentRoot.replaceChildren(message, retry);
                submitButton.disabled = !shareAll.checked;
            }
            throw error;
        }
        if (generation !== contentGeneration || moduleId !== moduleSelect.value) return;
        const nodes = provider.selection_types.map(selectionType => {
            const section = document.createElement('section');
            section.className = 'space-y-2 sm:col-span-2';
            const heading = document.createElement('h3');
            heading.className = 'font-mono text-[10px] font-black uppercase tracking-wider text-teal-400';
            heading.textContent = localizedTitle(selectionType);
            const grid = document.createElement('div');
            grid.className = 'grid gap-2 sm:grid-cols-2';
            const matchingItems = items.filter(item => item.selector_key === selectionType.selector_key);
            grid.replaceChildren(...matchingItems.map(item => {
                const label = document.createElement('label');
                label.className = 'flex gap-3 border border-zinc-800 bg-black p-3 text-sm text-zinc-300';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.name = 'shared-content';
                checkbox.value = item.id;
                checkbox.dataset.selectorKey = selectionType.selector_key;
                const text = document.createElement('span');
                text.textContent = item.subtitle ? `${item.title} · ${item.subtitle}` : item.title;
                label.append(checkbox, text);
                return label;
            }));
            if (!matchingItems.length) {
                const empty = document.createElement('p');
                empty.className = 'border border-dashed border-zinc-800 p-3 font-mono text-[10px] text-zinc-600';
                empty.textContent = 'No items';
                grid.append(empty);
            }
            section.append(heading, grid);
            return section;
        });
        contentRoot.replaceChildren(...nodes);
        contentRoot.classList.toggle('opacity-40', shareAll.checked);
        contentRoot.querySelectorAll('input').forEach(input => input.disabled = shareAll.checked);
        submitButton.disabled = false;
    }

    shareAll.addEventListener('change', () => {
        contentRoot.classList.toggle('opacity-40', shareAll.checked);
        contentRoot.querySelectorAll('input').forEach(input => input.disabled = shareAll.checked);
        document.getElementById('create-share').disabled =
            !shareAll.checked && !contentRoot.querySelector('input[name="shared-content"]');
    });
    moduleSelect.addEventListener('change', async () => {
        updateDefaultShareTitle();
        await loadContent();
    });

    document.getElementById('share-form').addEventListener('submit', async event => {
        event.preventDefault();
        if (document.getElementById('create-share').disabled) return;
        const selectedInputs = [...document.querySelectorAll('input[name="shared-content"]:checked')];
        if (!shareAll.checked && !selectedInputs.length) return alert('Select at least one item.');
        const selector = {};
        selectedInputs.forEach(input => {
            const key = input.dataset.selectorKey;
            if (!selector[key]) selector[key] = [];
            selector[key].push(input.value);
        });
        const expiration = document.getElementById('share-expiration').value;
        const payload = {
            module_id: moduleSelect.value,
            title: document.getElementById('share-title').value,
            selection_mode: shareAll.checked ? 'all' : 'selected',
            selector: shareAll.checked ? {} : selector,
            public: document.getElementById('share-public').checked,
            password: document.getElementById('share-password').value || null,
            expires_at: expiration ? new Date(expiration).toISOString() : null,
            allow_download: document.getElementById('share-download').checked,
        };
        const response = await fetch('/api/shares', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
        const data = await response.json();
        if (!response.ok) {
            const detail = Array.isArray(data.detail)
                ? data.detail.map(item => item.msg || item.message || JSON.stringify(item)).join('\n')
                : data.detail || 'Could not create share.';
            return alert(detail);
        }
        const result = document.getElementById('share-result');
        result.classList.remove('hidden');
        result.replaceChildren();
        const label = document.createElement('div');
        label.className = 'font-mono text-xs uppercase text-teal-400';
        label.textContent = 'Link created';
        const link = document.createElement('a');
        link.className = 'mt-2 block break-all text-white underline';
        link.href = data.url;
        link.target = '_blank';
        link.rel = 'noreferrer';
        link.textContent = data.url;
        const hint = document.createElement('div');
        hint.className = 'mt-2 text-xs text-zinc-500';
        hint.textContent = 'Private links are shown only once.';
        result.append(label, link, hint);
        await loadShares();
    });

    async function revokeShare(id) {
        await fetch(`/api/shares/${encodeURIComponent(id)}`, {method: 'DELETE'});
        await loadShares();
    }

    async function revokeAllShares() {
        if (!confirm('Revoke all active share links and terminate their sessions?')) return;
        const response = await fetch('/api/shares', {method: 'DELETE'});
        if (!response.ok) return alert('Could not revoke active shares.');
        await loadShares();
    }

    async function loadShares() {
        const shares = await fetch('/api/shares').then(r => r.json());
        const activeShares = shares.filter(share => share.status === 'active');
        const root = document.getElementById('shares-list');
        document.getElementById('revoke-all-shares').classList.toggle('hidden', !activeShares.length);
        if (!activeShares.length) {
            const empty = document.createElement('div');
            empty.className = 'border border-dashed border-zinc-800 bg-black py-12 text-center font-mono text-xs text-zinc-600';
            empty.textContent = 'No active shares';
            root.replaceChildren(empty);
            return;
        }
        root.replaceChildren(...activeShares.map(share => {
            const row = document.createElement('div');
            row.className = 'flex flex-col gap-3 border border-zinc-800 bg-zinc-950 p-4 sm:flex-row sm:items-center sm:justify-between';
            const info = document.createElement('div');
            info.innerHTML = `<div class="font-bold text-white"></div><div class="mt-1 font-mono text-[10px] uppercase text-zinc-500"></div>`;
            info.children[0].textContent = share.title;
            const provider = providersById[share.module_id];
            const selectionSummary = Object.entries(share.selector || {})
                .filter(([key]) => provider?.selection_types.some(item => item.selector_key === key))
                .filter(([, ids]) => Array.isArray(ids) && ids.length)
                .map(([key, ids]) => {
                    const type = provider?.selection_types.find(item => item.selector_key === key);
                    return `${ids.length} ${type ? localizedTitle(type) : key}`;
                }).join(' · ');
            info.children[1].textContent = `${share.module_id} · ${selectionSummary || 'entire module'} · ${share.access_count} accesses`;
            const button = document.createElement('button');
            button.className = 'border border-red-500/60 px-3 py-2 font-mono text-xs uppercase text-red-300 disabled:opacity-30';
            button.textContent = 'Revoke';
            button.disabled = share.status !== 'active';
            button.addEventListener('click', () => revokeShare(share.id));
            row.append(info, button);
            return row;
        }));
    }

    loadProviders().then(loadShares).catch(console.error);
    document.getElementById('revoke-all-shares').addEventListener('click', revokeAllShares);
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="{{ lang or 'en' }}" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex,nofollow">
    <title>{% block title %}NetSanctum{% endblock %}</title>
    <link rel="stylesheet" href="/static/tailwind.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
        media="print" onload="this.media='all'">
    <style>
        * {
            font-family: 'Inter', system-ui, sans-serif;
        }

        code,
        pre,
        .font-mono {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border: 1px solid #000;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #2dd4bf;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body class="bg-black text-zinc-300 min-h-screen font-sans antialiased pb-24 sm:pb-6">
    <header class="bg-black border-b-2 border-zinc-800 px-3 sm:px-6 py-3">
        <div class="mx-auto flex max-w-[1600px] items-center justify-between gap-4">
            <a href="/" class="text-base sm:text-xl font-black tracking-tight text-white uppercase font-mono flex items-center gap-2 shrink-0">
                <span class="w-3 h-3 sm:w-3.5 sm:h-3.5 bg-teal-400 inline-block"></span>
                <span>NetSanctum</span>
            </a>
            <span class="text-xs font-mono text-zinc-400 border border-zinc-800 rounded-none px-2 py-1.5 uppercase tracking-wider">Shared access</span>
        </div>
    </header>
    <main class="mx-auto max-w-[1600px] px-3 sm:px-6 py-4 sm:py-6 transition-all duration-500 max-w-full overflow-x-hidden">
        {% block content %}{% endblock %}
    </main>
</body>
</html>

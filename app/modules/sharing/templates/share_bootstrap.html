{% extends "shared_base.html" %}

{% block title %}{{ share.title }} | NetSanctum{% endblock %}

{% block head_extra %}<script src="/static/share-bootstrap.js" defer></script>{% endblock %}

{% block content %}
<div class="mx-auto mt-8 max-w-md border-2 border-zinc-800 bg-zinc-950 p-6 sm:p-8">
    <div class="font-mono text-[10px] uppercase tracking-[0.3em] text-teal-400">Private share</div>
    <h1 class="mt-2 text-2xl font-black text-white">{{ share.title }}</h1>
    <p id="share-bootstrap-status" class="mt-3 text-sm text-zinc-500">Opening protected module...</p>
    <form id="share-bootstrap-form" method="post" action="/s/{{ share.id }}/access" class="hidden">
        <input id="share-bootstrap-secret" type="hidden" name="secret">
    </form>
</div>
{% endblock %}

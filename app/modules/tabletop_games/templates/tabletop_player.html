<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ room.title }}</title><link rel="stylesheet" href="/static/tailwind.css"><style>body{background:radial-gradient(circle at 50% 0,#300909,#09090b 32%,#000 72%)}.role-card{background:linear-gradient(145deg,#2a0a0a,#09090b 65%);min-height:280px}.role-secret .role-content{filter:blur(16px);opacity:.2;user-select:none}.chat-list{max-height:36dvh;overflow:auto}.team-townsfolk,.team-outsider{color:#93c5fd}.team-minion,.team-demon{color:#f87171}</style></head>
<body class="min-h-dvh text-zinc-300"><main class="mx-auto max-w-2xl px-3 py-5 sm:py-9"><header class="flex items-start justify-between border-b border-red-950 pb-4"><div><div class="font-mono text-[9px] font-bold uppercase tracking-[.26em] text-red-500">{{ game.title_ru if game else room.game_id }}</div><h1 class="mt-1 text-xl font-black uppercase text-white">{{ room.title }}</h1></div><div class="text-right"><div class="font-mono text-[9px] uppercase text-zinc-600">Вы вошли как</div><div class="text-sm font-bold text-white">{{ participant.nickname }}</div><div id="connection" class="font-mono text-[8px] uppercase text-zinc-600">соединение...</div></div></header>
<section id="lobby" class="mt-6 border border-zinc-800 bg-zinc-950/80 p-6 text-center"><div class="font-mono text-[10px] font-bold uppercase tracking-[.25em] text-amber-500">Ожидание ведущего</div><div id="lobby-count" class="mt-4 text-4xl font-black text-white">—</div><p class="mt-2 text-xs text-zinc-500">игроков в комнате</p><div id="lobby-players" class="mt-5 flex flex-wrap justify-center gap-2"></div></section>
<section id="role-section" class="mt-6 hidden"><button id="role-card" onclick="this.classList.toggle('role-secret')" class="role-card role-secret relative w-full overflow-hidden border border-red-900 p-6 text-left"><div class="absolute right-3 top-3 font-mono text-[8px] uppercase tracking-widest text-zinc-600">Нажмите, чтобы скрыть / показать</div><div id="role-content" class="role-content flex min-h-[230px] flex-col justify-end"></div></button><div id="knowledge" class="mt-3 hidden border border-zinc-800 bg-zinc-950 p-4 text-xs text-zinc-400"></div></section>
<section class="mt-5 border border-zinc-800 bg-zinc-950"><div class="flex items-center justify-between border-b border-zinc-800 p-3"><div class="font-mono text-[10px] font-bold uppercase tracking-widest text-zinc-400">Сообщения</div><div id="unread" class="hidden h-2 w-2 rounded-full bg-red-500"></div></div><div id="messages" class="chat-list space-y-2 p-3"></div><form id="message-form" onsubmit="sendMessage(event)" class="border-t border-zinc-800 p-3"><select id="recipient" class="mb-2 w-full border border-zinc-800 bg-black p-2 text-xs text-zinc-300"><option value="gm">Ведущему</option></select><div class="flex gap-2"><input id="message-text" maxlength="1000" required class="min-w-0 flex-1 border border-zinc-800 bg-black p-2 text-sm text-white outline-none focus:border-red-700" placeholder="Сообщение..."><button class="bg-red-900 px-4 font-mono text-[9px] font-bold uppercase text-white">Отправить</button></div></form></section>
<section class="mt-5"><div class="mb-2 font-mono text-[9px] font-bold uppercase tracking-widest text-zinc-600">Круг игроков</div><div id="players" class="grid grid-cols-2 gap-2 sm:grid-cols-3"></div></section>
</main><script>
const code={{ room.code|tojson }},me={{ participant.id|tojson }};let state=null,ws=null;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options});if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||'Ошибка')}return r.json()}
async function load(){state=await api(`/tabletop/room/${code}/api/state`);render()}
function render(){const lobby=state.room.status==='lobby';document.getElementById('lobby').classList.toggle('hidden',!lobby);document.getElementById('role-section').classList.toggle('hidden',lobby);document.getElementById('lobby-count').textContent=`${state.participants.length} / ${state.room.config.player_limit}`;document.getElementById('lobby-players').innerHTML=state.participants.map(p=>`<span class="border border-zinc-800 px-2 py-1 text-[10px] ${p.online?'text-emerald-400':'text-zinc-600'}">${esc(p.nickname)}</span>`).join('');renderRole();document.getElementById('players').innerHTML=state.participants.map(p=>`<div class="border ${p.is_alive?'border-zinc-800':'border-red-950 opacity-50'} bg-zinc-950 p-3"><div class="flex items-center gap-2"><span class="h-1.5 w-1.5 rounded-full ${p.online?'bg-emerald-500':'bg-zinc-700'}"></span><span class="truncate text-xs font-bold ${p.id===me?'text-red-400':'text-zinc-300'}">${esc(p.nickname)}</span></div><div class="mt-1 font-mono text-[8px] uppercase text-zinc-600">${p.is_alive?'жив':'мёртв'}</div></div>`).join('');const rec=document.getElementById('recipient'),value=rec.value;rec.innerHTML='<option value="gm">Ведущему</option>'+(state.room.config.allow_player_messages?state.participants.filter(p=>p.id!==me).map(p=>`<option value="${p.id}">${esc(p.nickname)}</option>`).join(''):'');rec.value=[...rec.options].some(o=>o.value===value)?value:'gm';document.getElementById('messages').innerHTML=state.messages.map(m=>`<div class="${m.sender_id===me?'ml-6 border-red-900':'mr-6 border-zinc-800'} border bg-black p-2 text-xs"><div class="font-mono text-[8px] uppercase text-zinc-600">${esc(m.sender)}${m.audience==='broadcast'?' · всем':m.recipient?' → '+esc(m.recipient):' → ведущему'}</div><div class="mt-1 whitespace-pre-wrap text-zinc-300">${esc(m.text)}</div></div>`).join('');const box=document.getElementById('messages');box.scrollTop=box.scrollHeight;document.getElementById('message-form').classList.toggle('hidden',state.room.status==='ended')}
function renderRole(){const r=state.me.role,content=document.getElementById('role-content'),knowledge=document.getElementById('knowledge');if(!r){content.innerHTML='<div class="text-zinc-600">Роль не назначена</div>';return}content.innerHTML=`<div class="font-mono text-[9px] font-bold uppercase tracking-[.25em] team-${r.team}">${esc(r.team)}</div><div class="mt-2 text-3xl font-black uppercase text-white">${esc(r.name_ru)}</div><div class="mt-4 border-l-2 border-red-800 pl-4 text-sm leading-6 text-zinc-300">${esc(r.ability_ru)}</div>`;const k=state.me.knowledge||{},parts=[];if(k.evil_team?.length)parts.push(`<b class="text-red-400">Злая команда:</b> ${k.evil_team.map(esc).join(', ')}`);if(k.bluffs?.length)parts.push(`<b class="text-amber-400">Блефы:</b> ${k.bluffs.map(x=>esc(x.name_ru)).join(', ')}`);knowledge.innerHTML=parts.join('<br>');knowledge.classList.toggle('hidden',!parts.length)}
async function sendMessage(e){e.preventDefault();const target=document.getElementById('recipient').value,input=document.getElementById('message-text');try{await api(`/tabletop/room/${code}/api/messages`,{method:'POST',body:JSON.stringify({text:input.value,audience:target==='gm'?'gm':'player',recipient_id:target==='gm'?null:target})});input.value='';await load()}catch(err){alert(err.message)}}
function connect(){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/tabletop/room/${code}/ws`);ws.onopen=()=>{document.getElementById('connection').textContent='онлайн'};ws.onmessage=()=>load();ws.onclose=()=>{document.getElementById('connection').textContent='переподключение';setTimeout(connect,1500)}}
setInterval(()=>{if(ws?.readyState===1)ws.send('ping')},20000);load();connect();
</script></body></html>
